# このファイルを config.toml にコピーして使う（config.toml は .gitignore 対象）。
# 未設定の項目はコード内のデフォルト値が使われる。

# --------------------------------------
[ai]

base_url = "http://localhost:1234/v1"
api_key = "local-no-key"
llm_model = "qwen2.5-7b-instruct"
embed_model = "text-embedding-nomic-embed-text-v1.5"

# 画像説明（VLM）用モデル。visionモデル（例: Qwen2.5-VL / Qwen3-VL系）を指定する。
vlm_model = "qwen2.5-vl-7b-instruct"

timeout = 300.0
max_tokens = 2048

# --------------------------------------
[retrieval]

vector_weight = 0.5
top_k_candidates = 20
top_k_final = 5
# 検索前に、質問からLLMが検索に向いたクエリを作るか。false＝質問のまま検索（既定）。
# 7Bでは効いたが、32Bでは効果が見えなかった。LLM呼び出しが質問ごとに1回増える。
rewrite_query = false

# --------------------------------------
[agent]

# 既定値（max_attempts = 1、first_query = "rewrite"）は、小さいモデル（7B）での測定で最も良かった組み合わせ
# （検索クエリを作って1回検索する）。32Bでは通常方式と差が見えないので、大きいモデルでは通常方式を使う。
# LangGraphエージェントが検索を繰り返す上限回数（初回の検索を含む）。1なら再検索しない。
max_attempts = 1

# 「根拠が十分か」の判定の厳しさ。"strict"（厳しめ。再検索が増える）か "lenient"（甘め）。
grade_mode = "lenient"

# 1回目の検索に使うクエリ。"raw"（質問そのまま）か "rewrite"（質問からLLMが検索クエリを作る）。
first_query = "rewrite"

# --------------------------------------
