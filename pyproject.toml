# src レイアウトのパッケージを `pip install -e .` で解決できるようにする最小限の
# build-system/project設定。`python -m cae_rag.xxx` をリポジトリ直下からそのまま
# 実行できるようにするための最小限の設定（`pythonpath` はpytest専用で他には効かない）。
# 依存関係（本番用・開発用とも）はここが一次情報。別途requirements*.txtは置かない。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cae-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "chromadb>=0.5",
    "rank_bm25>=0.2",
    "streamlit>=1.38",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"` でテスト・lintツールも含めて導入する。
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src レイアウト（PyPA 推奨）。パッケージをリポジトリ直下ではなく src/ 配下に置くことで、
# フラットレイアウトだと起こりがちな「テストがカレントディレクトリ経由で生のソースを
# 偶然 import できてしまう」状態に依存せず、実際にインストールされた形に近い状態で
# 動作確認できる。テストからは pythonpath 経由で src/ を通す。
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "needs_llm: 実物のローカル LLM サーバー（LM Studio 等）を呼ぶ。無ければ skip",
]

# --- lint（ruff）------------------------------------------------------------
[tool.ruff]
target-version = "py311"
# 日本語コメント・文字列が全角で入るぶん、行が実測より短く見える。80/88 だと
# 「見た目は収まっているのに違反」が大量に出るので、少し広めの 110 にする。
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001-003（ambiguous-unicode）は、日本語の全角括弧・句読点・記号を軒並み
# 「紛らわしい Unicode」と誤検知する。このコードベースは日本語コメント／文字列が
# 主体なので、ルールごと無効化する。
ignore = ["RUF001", "RUF002", "RUF003"]

# --- 型チェック（mypy）---------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
